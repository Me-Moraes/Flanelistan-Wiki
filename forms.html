  <body id="topo">
    <header class="topo">
      <nav class="menu">
        <h1 class="CardTitle">Suporte</h1>
        <ul class="LinksMenu">

      </nav>
    </header>
    <main>
      <!-- id="topo" -->
      <form class="form">
        <h2 class="texto-form">Formulário para contato</h2>
        <div class="campos">
          <label for="ex-nome">Nome completo</label>
          <input
            type="text"
            id="ex-nome"
            name="nome"
            placeholder="Ex.: Maria Silva"
            required
          />
        </div>
        <div class="campos">
          <label for="ex-email">E-mail</label>
          <input
            type="email"
            id="ex-email"
            name="email"
            placeholder="seu@email.com"
            required
          />
        </div>
        <div class="campos">
          <label for="ex-tel">Telefone</label>
          <input
            type="tel"
            id="tel"
            name="tel"
            placeholder="(00) 00000-0000"
            required
          />
        </div>
        <div class="campos">
          <label for="ex-mensagem">Mensagem</label>
          <textarea
            id="ex-mensagem"
            name="mensagem"
            rows="4"
            placeholder="Descreva seu problema..."
          ></textarea>
        </div>
        <button type="submit">Enviar</button>
        <br /><br />
        <button type="reset">Resetar</button>
      </form>
    </main>
    <footer class="bottom">
      <article class="box">
        <div class="CardLeft">
